name: whatsapp2_0
description: "A WhatsApp clone built with Flutter targeting Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.5
  cloud_functions: ^5.4.4

  # Local database
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Navigation
  go_router: ^15.1.2

  # Functional programming / error handling
  fpdart: ^1.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Network connectivity
  connectivity_plus: ^6.1.4

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  # ffmpeg_kit_flutter is discontinued - will be replaced with alternative video compression
  # ffmpeg_kit_flutter_min: ^6.0.3

  # WebRTC for calls
  flutter_webrtc: ^0.12.5

  # Signal Protocol for E2EE
  libsignal_protocol_dart: ^0.7.0

  # Contacts feature
  crypto: ^3.0.6
  permission_handler: ^11.4.0
  flutter_contacts: ^1.1.9+2

  # Country code picker
  country_code_picker: ^3.0.0

  # Media feature
  file_picker: ^8.1.7
  record: ^6.2.0
  geolocator: ^13.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # Code generation for Drift and Riverpod
  build_runner: ^2.4.15
  drift_dev: ^2.26.1
  riverpod_generator: ^4.0.3

  # Mocking
  mocktail: ^1.0.4

  # Property-based testing
  # Note: 'fast_check' does not exist on pub.dev for Dart.
  # Using 'kiri_check' — a Dart property-based testing library integrated with package:test.
  kiri_check: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
